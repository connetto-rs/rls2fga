name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly container suite run against freshly pulled images, every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --no-run --lib --tests
          cargo test --workspace --doc --all-features

  no-std:
    name: no_std build (thumbv7em-none-eabi)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build lib without std for a bare-metal target
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabi

  docs:
    name: Rustdoc (warnings denied)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  coverage:
    name: Coverage and runtime parity (Codecov)
    runs-on: ubuntu-26.04
    # The container suites run on an instrumented build.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Verify Docker availability
        run: docker version

      # The server-backed modules of the `it` test binary are gated on `client`, and the
      # parity fixture replay on `parity`, which implies it, so without the feature they
      # would neither run nor count.
      - name: Collect in-process coverage for both workspace packages
        run: cargo llvm-cov -p rls2fga -p rls2fga-types --no-report --features parity --lib --tests

      # Pulled up front, so no test spends its startup deadline on a cold pull and the
      # suites can run side by side.
      - name: Pull the container images
        run: |
          docker pull postgres:18
          docker pull openfga/openfga:v1.11.6

      - name: Run the container-backed suites
        run: cargo llvm-cov -p rls2fga --no-report --features parity --test it -- --ignored --test-threads="$(nproc)"

      - name: Report coverage for both workspace packages
        run: cargo llvm-cov report -p rls2fga -p rls2fga-types --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
