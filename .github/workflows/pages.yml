name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise Pages deploys so two builds never race for the environment. Do not
# cancel an in-flight deploy when a new commit lands; let it finish so the site
# never sits half-replaced.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build web app and deploy to GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: web

      - name: Install dioxus-cli
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          # Pinned to match the dioxus library version in web/Cargo.lock; a
          # floating dx can diverge from the library and break the build.
          tool: dioxus-cli@0.7.9

      - name: Build web app
        working-directory: web
        run: dx build --release --platform web

      - name: Stage public artifact
        run: |
          OUT="web/target/dx/rls2fga-web/release/web/public"
          if [ ! -d "$OUT" ]; then
            echo "dx web output not found at $OUT" >&2
            echo "fallback scan:" >&2
            find web/target -type d -name public -path '*release*' >&2 || true
            exit 1
          fi
          mkdir -p _site
          cp -r "$OUT"/. _site/
          # CNAME associates the deployment with the custom domain and refuses
          # takeover by other Pages sites. It must match the Custom Domain set
          # under repo Settings > Pages.
          echo "rls2fga.luca.phd" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          # `_site` is copied with `cp -r "$OUT"/.`, so it carries whatever dotfiles the
          # build emits. v3 included them and v4 stopped, so this keeps the artifact the
          # same shape it has always had.
          include-hidden-files: true

      # The Pages backend has intermittently returned deployment_failed, observed on
      # `actions/deploy-pages@v4`. Creating a fresh deployment after a short pause almost
      # always succeeds. Retry twice before failing the job.
      - name: Deploy to GitHub Pages
        id: deploy-1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retrying (attempt 2)
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retrying (attempt 3)
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 3)
        id: deployment
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
