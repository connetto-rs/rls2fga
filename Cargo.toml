[workspace]
members = ["types"]
exclude = ["fuzz", "web"]
resolver = "2"

[package]
name = "rls2fga"
version = "0.1.0"
edition = "2021"
description = "Translate PostgreSQL RLS policies into OpenFGA authorization models"
readme = "README.md"
autotests = false

[features]
default = ["std"]
# Re-enables the standard library: the file-writing surface (`Outputs::write` and
# `output::formatter`). Also forwards `std`/stack-overflow
# protection to the parser dependencies. Disable for a `no_std` + `alloc`
# build of the parse/classify/generate pipeline.
std = ["rls2fga-types/std", "sqlparser/std", "sqlparser/recursive-protection", "sql-traits/std", "serde/std", "serde_json/std"]
# Writes a generated model to a running `OpenFGA` server, over a client the caller
# built. Off by default: everything else here needs no server, no async runtime and
# no gRPC stack.
client = ["std", "dep:openfga-client", "dep:prost"]

[dependencies]
rls2fga-types = { path = "types", default-features = false }
sqlparser = { version = "0.64", default-features = false, features = ["serde", "visitor"] }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "arbitrary_precision"] }
# Only the model write calls it, behind `client`.
openfga-client = { version = "0.6.1", optional = true }
# Measures the encoded model the way the server does, behind `client`.
prost = { version = "0.14", optional = true, default-features = false }
thiserror = { version = "2", default-features = false }
# Policy literals and request zones name IANA zones, which PostgreSQL reads from its tz database.
sql-values = { version = "0.5", default-features = false, features = ["tzdb"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The Postgres suites talk to a container, so the driver is test-only. No library code
# calls it, and a feature enabling it would claim otherwise.
diesel = { version = "2", features = ["postgres", "serde_json"] }
insta = { version = "1", features = ["json"] }
serde_json = "1"
testcontainers = "0.27"
# `test-util` is not in `full`, and the startup retry is tested on paused time rather than
# by sleeping through its own backoff.
tokio = { version = "1", features = ["full", "test-util"] }

# Every integration suite is a module of this one binary, since each binary links the
# whole dependency graph. The server-backed modules are gated on `client` inside it.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
deprecated = "deny"

[lints.clippy]
# Correctness & restriction
correctness = { level = "deny", priority = -1 }
enum_glob_use = "deny"
self_named_module_files = "deny"
# Style
style = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
# Perf
large_enum_variant = "warn"
needless_collect = "warn"
unnecessary_box_returns = "warn"
# Pedantic (selected)
pedantic = { level = "warn", priority = -1 }
# Pedantic overrides — too noisy or not applicable
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

[[bench]]
name = "records"
harness = false

[profile.mutants]
inherits = "test"
debug = "none"

# Route sqlparser (and every dependent: sql-traits, sql_docs) to datafusion-sqlparser-rs
# main. The published 0.62.0 release declares `#![no_std]` but its body still references
# `std::` in roughly 3200 spots, so it fails to compile without the standard library. The
# complete no_std hygiene exists only on main, which our no_std + alloc and wasm builds
# require. It is also why the crate cannot be published on crates.io (git deps are
# forbidden) until sqlparser ships a release above 0.62.0 carrying the no_std fixes.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
# Route sql-values (and sql-traits through it) to main, which carries PostgreSQL's bpchar
# equality ahead of a release.
sql-values = { git = "https://github.com/connetto-rs/sql-values", branch = "main" }
